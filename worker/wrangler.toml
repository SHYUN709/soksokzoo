name = "soksokzoo-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# API 키는 여기 쓰지 말고: npx wrangler secret put GEMINI_API_KEY

[vars]
# 쉼표로 여러 개. 끝에 / 없이, 프로토콜까지 정확히. 로컬 주소는 .dev.vars에만 (wrangler dev에서만 덮어씀)
ALLOWED_ORIGINS = "https://soksokzoo.vercel.app"
DAILY_LIMIT_PER_IP = "10"   # IP당 하루 호출 수 (질문 1회 + 해석 1회 = 2회)
DAILY_LIMIT_GLOBAL = "300"  # 전체 하루 호출 수
MODEL = "gemini-3.8-flash"  # Google AI Studio 무료 등급 모델
FALLBACK_MODEL = "gemini-3.5-flash-lite"  # MODEL이 붐비거나(503) 한도(429)일 때

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "59794f88bf614edbaa8ba910de33029f"

# 지난 요청 로그를 대시보드(Workers → soksokzoo-ai-proxy → Logs)에서 볼 수 있게
[observability]
enabled = true
